# NetworkManager.service drop-in: detach openconnect before NetworkManager
# stops, so a restart (a package upgrade) or a shutdown does not log the
# gateway session off and take wayle's cached cookie with it. ExecStop= runs
# before systemd signals NetworkManager, while it can still list its tunnels.
[Service]
ExecStop=/usr/lib/NetworkManager/dispatcher.d/pre-down.d/90-wayle-openconnect-detach "" nm-stop
